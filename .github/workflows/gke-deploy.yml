name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1 # e.g., us-central1, europe-west1
  GAR_REPOSITORY: my-docker-repo # Name of your Artifact Registry repository
  IMAGE_NAME: my-app
  GKE_CLUSTER: my-gke-cluster # Name of your GKE cluster
  GKE_ZONE: us-central1-a # Zone or region of your GKE cluster
  DEPLOYMENT_NAME: my-app-deployment # Name of the deployment inside Kubernetes

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest

    # Required permissions for Workload Identity Federation OIDC
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    # 1. Clone the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Authenticate to Google Cloud using OIDC
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: 'access_token'
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    # 3. Log into Google Artifact Registry
    - name: Docker Auth
      uses: docker/login-action@v3
      with:
        registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
        username: 'oauth2accesstoken'
        password: ${{ steps.auth.outputs.access_token }}

    # 4. Build the Docker container image and push it to GAR
    - name: Build and Push Container Image
      run: |
        TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        docker build -t "$TAG" .
        docker push "$TAG"

    # 5. Connect to the targeted GKE cluster
    - name: Set up GKE credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}

    # 6. Update the manifest and deploy to Kubernetes
    - name: Deploy to GKE
      run: |
        TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        # Set the dynamic image tag inside your deployment manifest
        kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} ${{ env.IMAGE_NAME }}="$TAG"
        # Apply configurations and verify rolling restart status
        kubectl apply -f kubernetes/
        kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }}
